# Usage:
# - Runs automated tests to ensure the Java project builds correctly.
# - If the build is successful, it packages the application into a Docker container.
# - The container is pushed to GHCR and deployed to the vps.

# Requirements:
# - Config file on the vps. (should be named `{Environment}.config.json`)
#   - Example: `production.config.json`
#   - Environment default: production
# - These secrets must be set up in the repository settings:
#   - SSH_PRIVATE_KEY: Private SSH key for accessing the vps
#   - SSH_USER: The SSH username for the vps
#   - SSH_HOST: The SSH host (IP or domain) of the vps
#   - WORK_DIR: The directory on the vps where the app is/will be deployed
#   - BOT_TOKEN_{environment}: Discord bot token per environment
#     - Example: BOT_TOKEN_PRODUCTION, BOT_TOKEN_DEV
#   - MONGO_URI: MongoDB connection string for the bot
#   - HYPIXEL_KEY: Hypixel API key for the bot
#   - SENTRY_DSN: Sentry DSN for error reporting (optional, Sentry disabled if empty)
#   - CONFIG_FOLDER_PATH: Path to the config file folder on the vps
#   - PACKS_FOLDER_PATH: Path to the resource packs folder on the vps (optional; defaults to CONFIG_FOLDER_PATH/packs)
#     This folder is mounted read-only at /app/packs, so each config resourcePacks.packs[].path
#     must be an absolute container path under /app/packs/ (e.g. /app/packs/hypixel_skyblock.zip);
#     a path that does not resolve inside the container is logged and skipped (that pack renders as vanilla).
#   - PACK_CACHE_FOLDER_PATH: Writable folder on the vps for automatically downloaded resource packs (optional;
#     defaults to CONFIG_FOLDER_PATH/pack-cache/<ENVIRONMENT_NAME>, one folder per environment). An explicit
#     PACK_CACHE_FOLDER_PATH must not be shared between environments: two bots in one cache folder delete
#     each other's downloads. Mounted read-write at /app/data/packs, which must match
#     generatorConfig.resourcePacks.autoUpdate.cacheDir. Docker creates it on first run. Deleting its
#     contents is safe: the bot falls back to the configured packs and downloads again.
#   - DRIVE_CREDENTIALS_FOLDER_PATH: Path on the vps to the folder holding drive-credentials.json (optional;
#     defaults to CONFIG_FOLDER_PATH, i.e. the key file sits next to the config file). The Google Drive
#     permission sync feature stays off if the file or DRIVE_EMAIL_KEY is absent.
#   - DRIVE_EMAIL_KEY: Base64-encoded 32-byte AES key used to encrypt linked Drive emails at rest (optional;
#     the Google Drive permission sync feature stays off if unset).
#   - SSH_KNOWN_HOSTS: The vps's SSH host key line(s), as printed by `ssh-keyscan <host>` (optional but
#     recommended). Without it the deploy trusts whatever key the host presents on each run.

name: Publish

on:
  workflow_dispatch:
    inputs:
      botEnvironmentType:
        description: 'Bot environment type (All uppercase):'
        required: true
        default: 'PRODUCTION'
        type: string
      metricsPort:
        description: 'Prometheus metrics port:'
        required: false
        default: '9190'
        type: string
      useOldImage: # Useful in case of crashes
        description: 'Use old Docker image:'
        required: true
        default: false
        type: boolean
      dockerNetwork:
        description: 'Docker network to join (for database connectivity, etc.):'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nerd-bot-${{ github.event.inputs.botEnvironmentType || 'PRODUCTION' }}:latest
  CONTAINER_NAME: nerd-bot-${{ github.event.inputs.botEnvironmentType || 'PRODUCTION' }}
  ENVIRONMENT_NAME: ${{ github.event.inputs.botEnvironmentType || 'PRODUCTION' }}
  METRICS_PORT: ${{ github.event.inputs.metricsPort || '9190' }}
  USE_OLD_IMAGE: ${{ github.event.inputs.useOldImage || 'false' }}
  DOCKER_NETWORK: ${{ github.event.inputs.dockerNetwork || secrets.DOCKER_NETWORK || '' }}

# The token only needs to read the code and push/pull the image
permissions:
  contents: read
  packages: write

jobs:
  # The inputs below end up inside a script that runs with sudo on the vps, so they may only hold
  # the characters such values need.
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$ENVIRONMENT_NAME" =~ ^[A-Z][A-Z0-9_]{0,31}$ ]] || fail "botEnvironmentType must be uppercase letters, digits and underscores"
          [[ "$METRICS_PORT" =~ ^[0-9]{2,5}$ ]] || fail "metricsPort must be a port number"
          [[ "$DOCKER_NETWORK" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$|^$ ]] || fail "dockerNetwork must be a Docker network name"
          [[ "$USE_OLD_IMAGE" == "true" || "$USE_OLD_IMAGE" == "false" ]] || fail "useOldImage must be true or false"

  publish:
    needs: validate
    name: Publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        if: ${{ env.USE_OLD_IMAGE == 'false' }}
        uses: actions/checkout@v7.0.1

      - name: Login to GHCR
        if: ${{ env.USE_OLD_IMAGE == 'false' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        if: ${{ env.USE_OLD_IMAGE == 'false' }}
        uses: docker/setup-buildx-action@v4

      - name: Set image tag
        if: ${{ env.USE_OLD_IMAGE == 'false' }}
        id: image
        run: echo "tag=${REGISTRY}/$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        if: ${{ env.USE_OLD_IMAGE == 'false' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            BRANCH_NAME=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=nerd-bot-${{ env.ENVIRONMENT_NAME }}
          cache-to: type=gha,mode=max,scope=nerd-bot-${{ env.ENVIRONMENT_NAME }},ignore-error=true

  deploy:
    needs: publish
    name: Deploy image
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH keys
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set, so the host key is not verified. Set it to the output of ssh-keyscan for the vps."
            ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
          fi

      # The bot's secrets reach the container as environment variables, read from a file only its
      # owner can open. They are sent over the SSH connection's input, so they never appear on a
      # command line on the vps. Docker reads each line as NAME=value with no quoting, so a value
      # may hold any character except a line break.
      - name: Send secrets
        env:
          BOT_TOKEN: ${{ secrets[format('BOT_TOKEN_{0}', env.ENVIRONMENT_NAME)] }}
          DB_MONGODB_URI: ${{ secrets.MONGO_URI }}
          HYPIXEL_KEY: ${{ secrets.HYPIXEL_KEY }}
          DRIVE_EMAIL_KEY: ${{ secrets.DRIVE_EMAIL_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          env_file=""
          for name in BOT_TOKEN DB_MONGODB_URI HYPIXEL_KEY DRIVE_EMAIL_KEY SENTRY_DSN; do
            value="${!name}"
            if [[ "$value" == *$'\n'* ]]; then
              echo "::error::The secret behind $name holds a line break"
              exit 1
            fi
            if [ -n "$value" ]; then
              env_file+="$name=$value"$'\n'
            fi
          done
          printf '%s' "$env_file" | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.WORK_DIR }} && umask 077 && cat > .$(echo "${{ env.CONTAINER_NAME }}" | tr '[:upper:]' '[:lower:]').env"

      - name: Deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ secrets.WORK_DIR }}
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          sudo docker pull ${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          sudo docker stop $(echo "${{ env.CONTAINER_NAME }}" | tr '[:upper:]' '[:lower:]') || true
          sudo docker rm $(echo "${{ env.CONTAINER_NAME }}" | tr '[:upper:]' '[:lower:]') || true
          sudo docker run -d --name $(echo "${{ env.CONTAINER_NAME }}" | tr '[:upper:]' '[:lower:]') \
            -p 127.0.0.1:${{ env.METRICS_PORT }}:${{ env.METRICS_PORT }} \
            ${{ env.DOCKER_NETWORK != '' && format('--network {0}', env.DOCKER_NETWORK) || '' }} \
            -v ${{ secrets.CONFIG_FOLDER_PATH }}/$(echo "${{ env.ENVIRONMENT_NAME }}" | tr '[:upper:]' '[:lower:]').config.json:/app/$(echo "${{ env.ENVIRONMENT_NAME }}" | tr '[:upper:]' '[:lower:]').config.json \
            -v ${{ secrets.PACKS_FOLDER_PATH != '' && secrets.PACKS_FOLDER_PATH || format('{0}/packs', secrets.CONFIG_FOLDER_PATH) }}:/app/packs:ro \
            -v ${{ secrets.PACK_CACHE_FOLDER_PATH != '' && secrets.PACK_CACHE_FOLDER_PATH || format('{0}/pack-cache/{1}', secrets.CONFIG_FOLDER_PATH, env.ENVIRONMENT_NAME) }}:/app/data/packs \
            -v ${{ secrets.DRIVE_CREDENTIALS_FOLDER_PATH != '' && secrets.DRIVE_CREDENTIALS_FOLDER_PATH || secrets.CONFIG_FOLDER_PATH }}/drive-credentials.json:/app/secrets/drive-credentials.json:ro \
            --env-file .$(echo "${{ env.CONTAINER_NAME }}" | tr '[:upper:]' '[:lower:]').env \
            -e "JAVA_OPTS=-Dbot.environment=${{ env.ENVIRONMENT_NAME }} \
            -Dbot.config=/app/$(echo "${{ env.ENVIRONMENT_NAME }}" | tr '[:upper:]' '[:lower:]').config.json \
            -Dmetrics.port=${{ env.METRICS_PORT }} \
            -Ddrive.credentials.path=/app/secrets/drive-credentials.json" \
            ${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          rm -f .$(echo "${{ env.CONTAINER_NAME }}" | tr '[:upper:]' '[:lower:]').env
          sudo docker image ls \
            "${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" \
            --filter dangling=true \
            --quiet |
            xargs -r sudo docker image rm
          EOF

      - name: Cleanup SSH keys
        run: rm -rf ~/.ssh